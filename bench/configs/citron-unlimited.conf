# Limits raised as far as the host allows, to find where citron itself saturates.
# Keys not set here take citron's defaults.

[server]
read_timeout_seconds = 300
write_timeout_seconds = 300
shutdown_grace_seconds = 60

[sandbox]
cache_entries = 8192
tmpfs_mb = 2048

[limits.execution]
cpu_time_seconds = 10
cpu_extra_time_seconds = 2
wall_time_seconds = 20
memory_mb = 2048
stack_mb = 512
max_processes = 256
max_file_mb = 256
stdout_mb = 16
stderr_mb = 16

[limits.compile]
wall_time_seconds = 60
cpu_time_seconds = 60
memory_mb = 4096
max_processes = 256
max_file_mb = 256
output_kb = 1024

[limits.submission]
max_testcases = 10000
max_source_mb = 10
max_total_input_mb = 512
max_total_output_mb = 512
max_parallel_testcases = 256
max_total_wall_time_seconds = 300

[scheduler]
max_concurrent_submissions = 1000
max_queue_wait_seconds = 180
execution_slots = 256
memory_budget_mb = 131072
