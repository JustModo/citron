# Large host, 16 GB. Keys not set here take citron's defaults.

[server]
read_timeout_seconds = 60
write_timeout_seconds = 120
shutdown_grace_seconds = 30

[sandbox]
cache_entries = 1024
tmpfs_mb = 256

[limits.execution]
memory_mb = 512
stack_mb = 128
max_processes = 64
max_file_mb = 32
stdout_mb = 2
stderr_mb = 2

[limits.compile]
memory_mb = 1024
max_processes = 128

[limits.submission]
max_source_mb = 2
max_total_input_mb = 64
max_total_output_mb = 64
max_parallel_testcases = 16

[scheduler]
max_concurrent_submissions = 32
max_queue_wait_seconds = 20
execution_slots = 16
memory_budget_mb = 12288
