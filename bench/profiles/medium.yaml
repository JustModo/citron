# Started by: node bench/stress.js --profile medium
services:
  citron:
    extends:
      file: ../../compose.yaml
      service: citron
    command: ["citron", "-config", "/opt/citron/configs/stress.conf", "-address", "0.0.0.0:2358"]
    volumes:
      - ../configs/citron-medium.conf:/opt/citron/configs/stress.conf:ro
    tmpfs: !override
      - /box:size=4g,mode=1777,exec
    cpus: 4
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "citron", "-config", "/opt/citron/configs/stress.conf", "-languages"]
networks:
  citron:
