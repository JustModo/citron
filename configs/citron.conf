################################################################################
# Citron Configuration File
################################################################################
# Citron is a sandboxed code execution engine providing secure, isolated
# execution of user-submitted source code under configurable resource limits.
#
# This configuration file is divided into logical sections controlling server
# settings, sandboxing, compilation/execution limits, scheduling, and logging.


################################################################################
# Server Configuration
################################################################################
[server]

# Network address and port for the Citron API server to listen on.
# Default: 127.0.0.1:2358
address = "127.0.0.1:2358"

# Maximum time in seconds to read request headers/body before timing out.
# Default: 30
read_timeout_seconds = 30

# Maximum time in seconds for writing the HTTP response.
# Default: 60
write_timeout_seconds = 60

# Grace period in seconds to wait for active submissions to finish on shutdown.
# Default: 20
shutdown_grace_seconds = 20

# Optional authentication token required in the X-Judge-Token header.
# Leave empty to disable authentication.
# Default: empty
auth_token = ""


################################################################################
# Sandbox Isolation Configuration
################################################################################
[sandbox]

# Sandbox isolation provider. Use "nsjail" for production or "local" for development.
# Default: nsjail
driver = "nsjail"

# Permit running unisolated binaries when using the "local" driver.
# Default: false
allow_unsafe_local = false

# Absolute path to the nsjail binary.
# Default: /usr/local/bin/nsjail
nsjail_path = "/usr/local/bin/nsjail"

# Control group v2 root hierarchy path for resource accounting and limits.
# Default: /sys/fs/cgroup/citron
cgroup_root = "/sys/fs/cgroup/citron"

# Root path for creating disposable submission workspaces.
# Default: /box
workspace_root = "/box"

# Directory used for caching compiled binary artifacts.
# Default: /box/cache
cache_root = "/box/cache"

# Maximum number of entries retained in the compile cache.
# Default: 256
cache_entries = 256

# Read-only filesystem paths exposed to sandboxed executions.
readonly_paths = ["/usr", "/etc/alternatives", "/etc/java-21-openjdk"]

# Symlink mappings created inside the jail environment.
symlinks = ["/usr/bin:/bin", "/usr/lib:/lib", "/usr/lib64:/lib64", "/usr/sbin:/sbin"]

# Temporary filesystem (tmpfs) memory limit in megabytes per execution.
# Default: 64
tmpfs_mb = 64


################################################################################
# Execution Limits
################################################################################
# Per-testcase resource caps enforced during program runtime.

[limits.execution]
# Maximum CPU time in seconds allocated to an execution.
# Default: 2
cpu_time_seconds = 2

# Extra grace CPU time in seconds before sending SIGKILL.
# Default: 0.5
cpu_extra_time_seconds = 0.5

# Maximum wall-clock time in seconds allowed per execution.
# Default: 4
wall_time_seconds = 4

# Maximum memory limit in megabytes per execution.
# Default: 256
memory_mb = 256

# Maximum stack size limit in megabytes.
# Default: 64
stack_mb = 64

# Maximum number of concurrent processes/threads allowed in the sandbox.
# Default: 32
max_processes = 32

# Maximum size in megabytes of any single file created by the execution.
# Default: 16
max_file_mb = 16

# Maximum stdout size limit in megabytes.
# Default: 1
stdout_mb = 1

# Maximum stderr size limit in megabytes.
# Default: 1
stderr_mb = 1


################################################################################
# Compilation Limits
################################################################################
# Resource constraints applied to compiler processes during code compilation.

[limits.compile]
# Maximum wall-clock time in seconds for compilation.
# Default: 15
wall_time_seconds = 15

# Maximum CPU time in seconds allocated for compilation.
# Default: 12
cpu_time_seconds = 12

# Maximum memory limit in megabytes for the compiler.
# Default: 512
memory_mb = 512

# Maximum process count for the compiler process tree.
# Default: 64
max_processes = 64

# Maximum compiler output file size in megabytes.
# Default: 64
max_file_mb = 64

# Maximum compiler diagnostic output log size in kilobytes.
# Default: 64
output_kb = 64


################################################################################
# Submission Limits
################################################################################
# Constraints applied per batch submission.

[limits.submission]
# Maximum number of testcases allowed per batch submission request.
# Default: 1000
max_testcases = 1000

# Maximum size in megabytes of submitted source code files.
# Default: 1
max_source_mb = 1

# Maximum combined input size in megabytes across all testcases in a submission.
# Default: 32
max_total_input_mb = 32

# Maximum combined output size in megabytes allowed across all testcases.
# Default: 32
max_total_output_mb = 32

# Maximum testcases executed concurrently per submission.
# Default: 4
max_parallel_testcases = 4

# Maximum total wall-clock time in seconds for processing an entire submission batch.
# Default: 30
max_total_wall_time_seconds = 30


################################################################################
# Scheduler Configuration
################################################################################
# Controls submission queueing, execution concurrency, and memory budget.

[scheduler]
# Maximum number of submissions allowed to execute concurrently.
# Default: 2
max_concurrent_submissions = 2

# Maximum queue wait time in seconds before returning HTTP 503 Service Unavailable.
# Default: 15
max_queue_wait_seconds = 15

# Number of parallel execution slots available for running testcases.
# Default: 2
execution_slots = 2

# Global memory budget in megabytes reserved for running executions.
# Default: 1024
memory_budget_mb = 1024


################################################################################
# Job Retry Configuration
################################################################################
[jobs]
# Maximum attempts for processing transient execution failures.
# Default: 2
max_attempts = 2


################################################################################
# Queue Driver Configuration
################################################################################
[queue]
# Queue driver implementation: "inproc" for single-node embedded queue, or "redis".
# Default: inproc
driver = "inproc"

# Connection URL for Redis queue driver (when driver = "redis").
# Default: empty
redis_url = ""

# Redis stream key name for submission queueing.
# Default: citron:submissions
stream = "citron:submissions"

# Redis consumer group name.
# Default: citron
group = "citron"


################################################################################
# Language Registry Configuration
################################################################################
[languages]
# Path to the language definitions TOML file.
# Default: configs/languages.toml
path = "configs/languages.toml"

# Require underlying compiler/runtime binaries to exist at startup.
# Default: true
require_toolchains = true


################################################################################
# Logging Configuration
################################################################################
[log]
# Minimum logging severity level ("debug", "info", "warn", "error").
# Default: info
level = "info"

# Structured logging output format ("json" or "text").
# Default: json
format = "json"
