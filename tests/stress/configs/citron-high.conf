# citron high-end profile configuration.
# Scaled for host system resources.

[server]
address = "0.0.0.0:2358"
read_timeout_seconds = 60
write_timeout_seconds = 120
shutdown_grace_seconds = 30
auth_token = ""

[sandbox]
driver = "nsjail"
allow_unsafe_local = false
nsjail_path = "/usr/local/bin/nsjail"
cgroup_root = "/sys/fs/cgroup/citron"
workspace_root = "/box"
cache_root = "/box/cache"
cache_entries = 1024
readonly_paths = ["/usr", "/etc/alternatives", "/etc/java-21-openjdk"]
symlinks = ["/usr/bin:/bin", "/usr/lib:/lib", "/usr/lib64:/lib64", "/usr/sbin:/sbin"]
tmpfs_mb = 256

[limits.execution]
cpu_time_seconds = 2
cpu_extra_time_seconds = 0.5
wall_time_seconds = 4
memory_mb = 512
stack_mb = 128
max_processes = 64
max_file_mb = 32
stdout_mb = 2
stderr_mb = 2

[limits.compile]
wall_time_seconds = 15
cpu_time_seconds = 12
memory_mb = 1024
max_processes = 128
max_file_mb = 64
output_kb = 64

[limits.submission]
max_testcases = 1000
max_source_mb = 2
max_total_input_mb = 64
max_total_output_mb = 64
max_parallel_testcases = 16
max_total_wall_time_seconds = 30

[scheduler]
max_concurrent_submissions = 32
max_queue_wait_seconds = 20
execution_slots = 16
memory_budget_mb = 12288

[jobs]
max_attempts = 2

[queue]
driver = "inproc"
redis_url = ""
stream = "citron:submissions"
group = "citron"

[languages]
path = "/opt/citron/configs/languages.toml"
require_toolchains = true

[log]
level = "info"
format = "json"
