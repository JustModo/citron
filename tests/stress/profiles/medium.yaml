services:
  citron-medium:
    build:
      context: ../../..
      dockerfile: Dockerfile
    image: citron:latest
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    security_opt:
      - apparmor=unconfined
      - systempaths=unconfined
    cgroup: private
    command: ["citron", "-config", "/opt/citron/configs/citron-medium.conf", "-address", "0.0.0.0:2358"]
    networks: [citron]
    ports:
      - "127.0.0.1:2358:2358"
    tmpfs:
      - /box:size=4g,mode=1777,exec
    volumes:
      - ../configs/citron-medium.conf:/opt/citron/configs/citron-medium.conf:ro
      - ../../../configs/languages.toml:/opt/citron/configs/languages.toml:ro
    cpus: 4
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "citron", "-config", "/opt/citron/configs/citron-medium.conf", "-languages"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

networks:
  citron:
    driver: bridge
