global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # Above server.write_timeout_seconds: a submission holds its request until judged.
    timeout client 65s
    timeout server 65s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend citron
    bind :2358
    default_backend citron

backend citron
    balance leastconn
    option httpchk GET /ready
    http-check expect status 200
    server-template citron 10 citron:2358 check inter 2s resolvers docker init-addr none
